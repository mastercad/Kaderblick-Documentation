<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/symfony/public

    <Directory /var/www/symfony/public>
        AllowOverride All
        Require all granted

        # FallbackResource leitet alle Requests an index.php weiter,
        # sofern keine physische Datei/Ordner existiert.
        FallbackResource /index.php
    </Directory>

    # Statische Assets langzeit cachen; Cache-Busting via ?v=x (Symfony assets.version)
    <FilesMatch "\.(obj|mtl|svg|json|css|js|png|jpg|webp|woff2?)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
